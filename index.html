<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Личная база знаний и проектов"><title>Атлас — личная база знаний</title><meta name="theme-color" content="#0a0e16"><link rel="icon" type="image/svg+xml" href="cat.svg"><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body>
<aside><div class="brand"><img class="brand-icon" src="cat.svg" width="40" height="40" alt=""><div>Атлас<small>ЛИЧНАЯ БАЗА ЗНАНИЙ</small></div></div><nav id="nav" aria-label="Разделы"></nav><div class="data"><button id="export">↓ Экспорт JSON</button><button id="import">↑ Импорт JSON</button><input id="file" type="file" accept=".json,application/json" hidden><small>Данные хранятся в этом браузере</small></div></aside>
<main><header><div class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="Поиск по базе" placeholder="Поиск по базе"><kbd>/</kbd></div><button class="primary" id="add">＋ Добавить</button></header><div class="content"><section class="intro"><div><h1 id="title"></h1><p id="subtitle"></p></div></section><div id="stats"></div><div id="filters"><label>Статус <select id="status"><option value="">Все статусы</option></select></label><label>Тег <select id="tag"><option value="">Все теги</option></select></label><label id="sort-label" hidden>Порядок <select id="sort"><option value="name">По имени</option><option value="birthday">Ближайшие дни рождения</option></select></label></div><div id="results"></div><p id="notice" role="status"></p></div></main>
<dialog id="editor"><form id="form"><div class="dialog-head"><h2 id="form-title"></h2><button type="button" id="close" aria-label="Закрыть">×</button></div><label>Категория<select name="type" id="type"></select></label><label>Название или имя<input name="title" required maxlength="160"></label><div id="fields"></div><label>Заметки<textarea name="body" rows="4"></textarea></label><label>Теги через запятую<input name="tags" placeholder="Например, электроника, учёба"></label><fieldset><legend>Связанные записи</legend><div id="links"></div></fieldset><div class="dialog-foot"><button type="button" id="delete">Удалить</button><button class="primary" type="submit">Сохранить</button></div></form></dialog>
<dialog id="detail"><div id="detail-content"></div></dialog>
</body></html>
